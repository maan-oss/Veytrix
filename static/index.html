<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veytrix">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png">
<title>Veytrix</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app" id="app" data-view="monitor">

  <header class="bar">
    <button class="icon-btn desk" id="sideBtn" aria-label="Show or hide the sidebar" title="Sidebar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="4"/><path d="M9.5 4.5v15"/></svg>
    </button>
    <div class="bar-title">
      <h1 id="viewTitle">Monitor</h1>
      <p id="viewSub"></p>
    </div>
    <button class="status-pill" id="detectPill" data-state="on" aria-pressed="true"><i></i><span>Detecting</span></button>
  </header>

  <nav class="side" id="side" aria-label="Sections"></nav>

  <main class="content">
    <section class="view" data-view-id="monitor">
      <div class="banner" id="banner" hidden></div>
      <div class="mon-main">
        <div class="cams" id="cams"></div>
        <div class="logcard">
          <div class="loghead">
            <label class="search">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
              <input id="q" type="search" placeholder="Search place, camera or ID" autocomplete="off" aria-label="Search events">
            </label>
            <div class="seg" id="filt" role="group" aria-label="Filter events">
              <span class="ind"></span>
              <button data-v="all" class="on">All</button>
              <button data-v="litter">Littering</button>
              <button data-v="spit">Spitting</button>
              <button data-v="open">Open</button>
            </div>
          </div>
          <div class="list" id="list"></div>
        </div>
      </div>
    </section>

    <section class="view" data-view-id="cameras">
      <div class="camgrid" id="camGrid"></div>
    </section>

    <section class="view" data-view-id="notices">
      <div class="plain" id="noticeList"></div>
    </section>

    <section class="view" data-view-id="settings">
      <div class="plain" id="settingsBody"></div>
    </section>
  </main>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details">
    <div class="sh-top">
      <div class="grab"></div>
      <button class="sh-close" id="shClose" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
    <div class="sh-body" id="shBody"></div>
  </article>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
